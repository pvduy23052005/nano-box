events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off;

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream frontend_upstream {
        server nano-box-frontend:3000;
    }

    upstream backend_upstream {
        server nano-box-backend:5050;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name nano-boxes.id.vn localhost;
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Chuyển hướng HTTPS: Ép buộc tất cả truy cập HTTP chuyển sang HTTPS với mã 301.
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Port 443 (HTTPS): Tiếp nhận traffic bảo mật, bật HTTP/2 và phân phối lưu lượng cho hệ thống.
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name nano-boxes.id.vn localhost;

        # SSL certs: Nạp cặp khóa chứng chỉ SSL mount từ thư mục ./ssl bên ngoài máy chủ.
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # SSL security & cache: Chỉ dùng TLS 1.2/1.3 và lưu cache phiên 1 ngày để tăng tốc bắt tay SSL.
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security headers: Ép HTTPS 1 năm (HSTS), chống tấn công MIME-sniffing và Clickjacking qua iframe.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;

        # Client body size: Cho phép upload file tối đa 25MB (tránh lỗi 413 Payload Too Large).
        client_max_body_size 25M;

        # Route /graphql: Điều hướng API GraphQL sang NestJS backend (giấu IP gốc và chặn lỗi CORS).
        location /graphql {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Route /socket.io/: Giữ kết nối WebSocket realtime cho chat với timeout 24 giờ (86400s).
        location /socket.io/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Route /upload: Chuyển tiếp các request tải file đa phương tiện (ảnh, tệp) sang NestJS backend.
        location /upload {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Route /_next/static/: Cache tài nguyên tĩnh Next.js (JS, CSS) 365 ngày trên trình duyệt để tải siêu nhanh.
        location /_next/static/ {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            expires 365d;
            access_log off;
        }

        # Route /: Điều hướng toàn bộ giao diện Next.js (SSR và routing) tới frontend container.
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
