events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    upstream frontend_upstream {
        server nano_box_frontend:3000;
    }

    upstream backend_upstream {
        server nano_box_backend:5050;
    }

    # 1. Block đón cổng 80: Ép chuyển hướng toàn bộ sang HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name localhost;

        return 301 https://$host$request_uri;
    }

    # 2. Block đón cổng 443: Cấu hình SSL và phân phối traffic
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name localhost;

        # Đường dẫn chứng chỉ (mount từ thư mục ./nginx/ssl vào /etc/nginx/ssl)
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # Cấu hình giao thức bảo mật
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        client_max_body_size 20M;

        # Điều hướng API sang backend NestJS
        location /graphql {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Cache static Next.js
        location /_next/static/ {
            proxy_pass http://frontend_upstream;
            proxy_cache_bypass $http_upgrade;
            expires 365d;
            access_log off;
        }

        # Điều hướng giao diện Next.js
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}