name: Docker Build & Push (Reusable)

on:
  workflow_call:
    inputs:
      service:
        description: "Tên service dùng làm hậu tố image và scope cache (vd: backend, frontend)"
        required: true
        type: string
      context:
        description: "Thư mục build context Docker"
        required: true
        type: string
      dockerfile:
        description: "Đường dẫn tới Dockerfile"
        required: true
        type: string
      build_args:
        description: "Các build-args không nhạy cảm (tùy chọn)"
        required: false
        type: string
        default: ""
    secrets:
      NEXT_PUBLIC_GOOGLE_CLIENT_ID:
        description: "Google Client ID cho Frontend Next.js build"
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build-docker-matrix:
    name: Build Docker (${{ inputs.service }} - ${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Đăng nhập GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build và Push Docker Image theo Platform
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository }}-${{ inputs.service }}:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ inputs.service }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}-${{ matrix.arch }}
          build-args: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID != '' && format('NEXT_PUBLIC_GOOGLE_CLIENT_ID={0}', secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID) || inputs.build_args }}

  merge-manifest:
    name: Create Multi-Arch Manifest (${{ inputs.service }})
    needs: build-docker-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Bỏ qua gộp manifest trên Pull Request
        if: github.event_name == 'pull_request'
        run: echo "PR build only - Bỏ qua bước merge manifest khi đang mở PR."

      - name: Đăng nhập GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trích xuất metadata Docker cho Manifest chung
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ inputs.service }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Gộp các image thành Multi-Arch Manifest
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository }}-${{ inputs.service }}"
          TAGS_ARGS=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && TAGS_ARGS+=(-t "$tag")
          done <<< "$TAGS"

          docker buildx imagetools create "${TAGS_ARGS[@]}" \
            "${IMAGE_NAME}:${{ github.sha }}-amd64" \
            "${IMAGE_NAME}:${{ github.sha }}-arm64"
