name: Continuous Deployment (CD)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Self-Hosted VM
    runs-on: self-hosted

    steps:
      - name: Pull latest Docker images
        run: |
          cd ~/nano-box
          docker compose pull frontend backend

      - name: Recreate containers with new images
        run: |
          cd ~/nano-box
          docker compose up -d

      - name: Refresh Nginx reverse proxy
        run: |
          docker restart nano-nginx

      - name: Clean up unused dangling images
        run: |
          docker image prune -f
