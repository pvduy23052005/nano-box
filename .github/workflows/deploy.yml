name: Continuous Deployment (CD)

on:
  workflow_run:
    workflows:
      - "Backend CI (Build, Test & Docker Push)"
      - "Frontend CI (Build, Test & Docker Push)"
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy to Self-Hosted VM
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      - name: Pull latest Docker images
        run: |
          cd ~/nano-box
          docker compose pull frontend backend

      - name: Recreate containers with new images
        run: |
          cd ~/nano-box
          docker compose up -d --remove-orphans

      - name: Refresh Nginx reverse proxy
        run: |
          cd ~/nano-box
          docker compose exec -T nginx nginx -s reload || docker compose restart nginx

      - name: Clean up unused dangling images
        run: |
          docker image prune -f

      - name: Kiểm tra trạng thái containers
        run: |
          cd ~/nano-box
          docker compose ps
