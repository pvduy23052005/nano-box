name: Frontend CI (Build, Test & Docker Push)

on:
  push:
    branches: ["main"]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - '.github/workflows/docker-publish.yml'
  pull_request:
    branches: ["main"]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - '.github/workflows/docker-publish.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: Lint & Type Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt PNPM CLI
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Khởi tạo môi trường Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: ./frontend/pnpm-lock.yaml

      - name: Cài đặt Dependencies
        run: pnpm install --frozen-lockfile

      - name: Sinh Next.js Type Definitions
        run: pnpm exec next typegen

      - name: Kiểm tra TypeScript (Type Check)
        run: pnpm exec tsc --noEmit

      - name: Kiểm tra ESLint (Lint)
        run: pnpm lint

  publish-docker:
    name: Docker Build & Push
    needs: verify
    uses: ./.github/workflows/docker-publish.yml
    with:
      service: frontend
      context: ./frontend
      dockerfile: ./frontend/Dockerfile
    secrets:
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
