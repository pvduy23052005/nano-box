name: Gateway CI (Build, Test & Docker Push)

on:
  push:
    branches: ["main", "microservices"]
    paths:
      - 'services/api-gateway/**'
      - '.github/workflows/gateway-ci.yml'
      - '.github/workflows/docker-publish.yml'
  pull_request:
    branches: ["main", "microservices"]
    paths:
      - 'services/api-gateway/**'
      - '.github/workflows/gateway-ci.yml'
      - '.github/workflows/docker-publish.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  test-and-verify:
    name: Test Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/api-gateway

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt PNPM CLI
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Thiết lập môi trường Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: services/api-gateway/pnpm-lock.yaml

      - name: Cài đặt Dependencies
        run: pnpm install --frozen-lockfile

      - name: Kiểm tra Lint
        run: pnpm run lint

      - name: Chạy Unit Tests
        run: pnpm run test

      - name: Chạy E2E Tests
        run: pnpm run test:e2e

      - name: Kiểm tra Build
        run: pnpm run build

  publish-docker:
    name: Publish Docker Image
    needs: test-and-verify
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/microservices')
    uses: ./.github/workflows/docker-publish.yml
    with:
      service: api-gateway
      context: ./services/api-gateway
      dockerfile: ./services/api-gateway/Dockerfile
    secrets: inherit
