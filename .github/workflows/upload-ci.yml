name: Upload CI (Build, Test & Docker Push)

on:
  push:
    branches: ["main"]
    paths:
      - 'services/upload/**'
      - 'proto/**'
      - '.github/workflows/upload-ci.yml'
      - '.github/workflows/docker-publish.yml'
  pull_request:
    branches: ["main"]
    paths:
      - 'services/upload/**'
      - 'proto/**'
      - '.github/workflows/upload-ci.yml'
      - '.github/workflows/docker-publish.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  test-and-verify:
    name: Test Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/upload

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt PNPM CLI
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Thiết lập môi trường Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: services/upload/pnpm-lock.yaml

      - name: Cài đặt Dependencies
        run: pnpm install --frozen-lockfile

      - name: Chạy Unit Tests
        run: pnpm run test

      - name: Kiểm tra Build
        run: pnpm run build

  publish-docker:
    name: Publish Docker Image
    needs: test-and-verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/docker-publish.yml
    with:
      service: upload-service
      context: .
      dockerfile: ./services/upload/Dockerfile
    secrets: inherit
