version: '3.8'

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: nano_box_backend
    restart: unless-stopped
    ports:
      - "5050:5050"
    env_file:
      - ./backend/.env
    environment:
      - MONGO_URI=mongodb://host.docker.internal:27017/nano-box
    networks:
      - nano_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nano_box_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
      - ./frontend/.env.local
    depends_on:
      - backend
    networks:
      - nano_network

networks:
  nano_network:
    driver: bridge
