version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: nano-box-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - api-gateway
    networks:
      - nano_network

  redis:
    image: redis:7-alpine
    container_name: nano-redis
    restart: unless-stopped
    env_file:
      - ./backend/.env
    command: >
      sh -c 'exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 50mb --maxmemory-policy allkeys-lru --appendonly yes'
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nano_network
    deploy:
      resources:
        limits:
          memory: 80M
    healthcheck:
      test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+-a \"$$REDIS_PASSWORD\"} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: nano-rabbitmq
    hostname: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-nanobox}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:-nanobox_secret}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - nano_network
    deploy:
      resources:
        limits:
          memory: 384M
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: nano-box-backend:local
    container_name: nano-box-backend
    restart: unless-stopped
    ports:
      - "5050:5050"
    env_file:
      - ./backend/.env
    environment:
      - MONGO_URI=mongodb://host.docker.internal:27017/nano-box
      - REDIS_HOST=redis
      - UPLOAD_GRPC_URL=upload-service:50052
      - NOTIFICATION_GRPC_URL=notification-service:50053
      - RABBITMQ_URL=amqp://${RABBITMQ_DEFAULT_USER:-nanobox}:${RABBITMQ_DEFAULT_PASS:-nanobox_secret}@rabbitmq:5672
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5050/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"   
        max-file: "3"       
    networks:
      - nano_network

  upload-service:
    build:
      context: .
      dockerfile: services/upload/Dockerfile
    image: nano-box-upload-service:local
    container_name: nano-box-upload-service
    restart: unless-stopped
    ports:
      - "5051:5051"
    env_file:
      - ./services/upload/.env
    environment:
      - PORT=5051
      - GRPC_PORT=50052
      - GRPC_HOST=0.0.0.0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5051/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - nano_network

  notification-db:
    image: mongo:7
    container_name: nano-notification-db
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - notification_mongodb_data:/data/db
    networks:
      - nano_network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  notification-service:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    image: nano-box-notification-service:local
    container_name: nano-box-notification-service
    restart: unless-stopped
    ports:
      - "5052:5052"
    env_file:
      - ./services/notification/.env
    environment:
      - PORT=5052
      - GRPC_PORT=50053
      - GRPC_HOST=0.0.0.0
      - MONGO_URI=mongodb://notification-db:27017/nano-box-notification
      - RABBITMQ_URL=amqp://${RABBITMQ_DEFAULT_USER:-nanobox}:${RABBITMQ_DEFAULT_PASS:-nanobox_secret}@rabbitmq:5672
    depends_on:
      notification-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5052/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - nano_network

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    image: nano-box-api-gateway:local
    container_name: nano-box-api-gateway
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ./services/api-gateway/.env
    environment:
      - PORT=4000
      - BACKEND_SERVICE_URL=http://backend:5050
      - UPLOAD_SERVICE_URL=http://upload-service:5051
      - NOTIFICATION_SERVICE_URL=http://notification-service:5052
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - nano_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: nano-box-frontend:local
    container_name: nano-box-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
      - ./frontend/.env.local
    depends_on:
      - api-gateway
    networks:
      - nano_network

networks:
  nano_network:
    name: nano_network
    driver: bridge

volumes:
  redis_data:
    name: nano_redis_data
    driver: local
  notification_mongodb_data:
    name: nano_notification_mongodb_data
    driver: local
  rabbitmq_data:
    name: nano_rabbitmq_data
    driver: local

