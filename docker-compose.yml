version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: nano-box-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - nano_network

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    image: nano-box-backend:local
    container_name: nano-box-backend
    restart: unless-stopped
    ports:
      - "5050:5050"
    env_file:
      - ./backend/.env
    environment:
      - MONGO_URI=mongodb://host.docker.internal:27017/nano-box

    logging:
      driver: "json-file"
      options:
        max-size: "10m"   
        max-file: "3"       
    networks:
      - nano_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: nano-box-frontend:local
    container_name: nano-box-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
      - ./frontend/.env.local
    depends_on:
      - backend
    networks:
      - nano_network

networks:
  nano_network:
    name: nano_network
    driver: bridge
