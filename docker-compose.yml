version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: nano-box-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - nano_network

  redis:
    image: redis:7-alpine
    container_name: nano-redis
    restart: unless-stopped
    env_file:
      - ./backend/.env
    command: >
      sh -c 'exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 50mb --maxmemory-policy allkeys-lru --appendonly yes'
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nano_network
    deploy:
      resources:
        limits:
          memory: 80M
    healthcheck:
      test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+-a \"$$REDIS_PASSWORD\"} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    image: nano-box-backend:local
    container_name: nano-box-backend
    restart: unless-stopped
    ports:
      - "5050:5050"
    env_file:
      - ./backend/.env
    environment:
      - MONGO_URI=mongodb://host.docker.internal:27017/nano-box
      - REDIS_HOST=redis
    depends_on:
      redis:
        condition: service_healthy

    logging:
      driver: "json-file"
      options:
        max-size: "10m"   
        max-file: "3"       
    networks:
      - nano_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: nano-box-frontend:local
    container_name: nano-box-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
      - ./frontend/.env.local
    depends_on:
      - backend
    networks:
      - nano_network

networks:
  nano_network:
    name: nano_network
    driver: bridge

volumes:
  redis_data:
    name: nano_redis_data
    driver: local
