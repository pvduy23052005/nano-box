version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: nano-box-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - api-gateway
    networks:
      - nano_network

  redis:
    image: redis:7-alpine
    container_name: nano-redis
    restart: unless-stopped
    env_file:
      - ./backend/.env
    command: >
      sh -c 'exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 50mb --maxmemory-policy allkeys-lru --appendonly yes'
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nano_network
    deploy:
      resources:
        limits:
          memory: 80M
    healthcheck:
      test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+-a \"$$REDIS_PASSWORD\"} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    image: nano-box-backend:local
    container_name: nano-box-backend
    restart: unless-stopped
    ports:
      - "5050:5050"
    env_file:
      - ./backend/.env
    environment:
      - MONGO_URI=mongodb://host.docker.internal:27017/nano-box
      - REDIS_HOST=redis
      - UPLOAD_GRPC_URL=upload-service:50052
    depends_on:
      redis:
        condition: service_healthy
      upload-service:
        condition: service_started

    logging:
      driver: "json-file"
      options:
        max-size: "10m"   
        max-file: "3"       
    networks:
      - nano_network

  upload-service:
    build:
      context: .
      dockerfile: services/upload/Dockerfile
    image: nano-box-upload-service:local
    container_name: nano-box-upload-service
    restart: unless-stopped
    ports:
      - "5051:5051"
    env_file:
      - ./services/upload/.env
    environment:
      - PORT=5051
      - GRPC_PORT=50052
      - GRPC_HOST=0.0.0.0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - nano_network

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    image: nano-box-api-gateway:local
    container_name: nano-box-api-gateway
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ./services/api-gateway/.env
    environment:
      - PORT=4000
      - BACKEND_SERVICE_URL=http://backend:5050
      - UPLOAD_SERVICE_URL=http://upload-service:5051
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
      upload-service:
        condition: service_started
    networks:
      - nano_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: nano-box-frontend:local
    container_name: nano-box-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
      - ./frontend/.env.local
    depends_on:
      - api-gateway
    networks:
      - nano_network

networks:
  nano_network:
    name: nano_network
    driver: bridge

volumes:
  redis_data:
    name: nano_redis_data
    driver: local
