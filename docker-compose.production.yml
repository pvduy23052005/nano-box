name: nano-box

services:
  mongodb:
    image: mongo:latest
    container_name: nano-mongodb
    restart: unless-stopped
    env_file:
      - ./database/.env
    volumes:
      - mongodb_data:/data/db
    networks:
      - nano_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: nano-redis
    restart: unless-stopped
    env_file:
      - ./backend/.env
    command: >
      sh -c 'exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 50mb --maxmemory-policy allkeys-lru --appendonly yes'
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - nano_network
    deploy:
      resources:
        limits:
          memory: 80M
    healthcheck:
      test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+-a \"$$REDIS_PASSWORD\"} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: nano-rabbitmq
    hostname: rabbitmq
    restart: unless-stopped
    env_file:
      - ./backend/.env
    expose:
      - "5672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - nano_network
    deploy:
      resources:
        limits:
          memory: 384M
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ghcr.io/pvduy23052005/nano-box-backend:latest
    container_name: nano-box-backend
    restart: unless-stopped
    expose:
      - "5050"
    env_file:
      - ./backend/.env
    environment:
      - REDIS_HOST=redis
      - UPLOAD_GRPC_URL=upload-service:50052
      - NOTIFICATION_GRPC_URL=notification-service:50053
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5050/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - nano_network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  upload-service:
    image: ghcr.io/pvduy23052005/nano-box-upload-service:latest
    container_name: nano-box-upload-service
    restart: unless-stopped
    expose:
      - "5051"
      - "50052"
    env_file:
      - ./services/upload/.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5051/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - nano_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  notification-db:
    image: mongo:7
    container_name: nano-notification-db
    restart: unless-stopped
    expose:
      - "27017"
    volumes:
      - notification_mongodb_data:/data/db
    networks:
      - nano_network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  notification-service:
    image: ghcr.io/pvduy23052005/nano-box-notification-service:latest
    container_name: nano-box-notification-service
    restart: unless-stopped
    expose:
      - "5052"
      - "50053"
    env_file:
      - ./services/notification/.env
    environment:
      - MONGO_URI=mongodb://notification-db:27017/nano-box-notification
    depends_on:
      notification-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5052/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - nano_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  realtime-gateway:
    image: ghcr.io/pvduy23052005/nano-box-realtime-gateway:latest
    container_name: nano-box-realtime-gateway
    restart: unless-stopped
    expose:
      - "5053"
    env_file:
      - ./backend/.env
    environment:
      - PORT=5053
      - ALLOWED_ORIGINS=https://nano-boxes.id.vn
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5053/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - nano_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api-gateway:
    image: ghcr.io/pvduy23052005/nano-box-api-gateway:latest
    container_name: nano-box-api-gateway
    restart: unless-stopped
    expose:
      - "4000"
    env_file:
      - ./services/api-gateway/.env
    environment:
      - PORT=4000
      - BACKEND_SERVICE_URL=http://backend:5050
      - UPLOAD_SERVICE_URL=http://upload-service:5051
      - NOTIFICATION_SERVICE_URL=http://notification-service:5052
      - REALTIME_GATEWAY_URL=http://realtime-gateway:5053
      - ALLOWED_ORIGINS=https://nano-boxes.id.vn
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - nano_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ghcr.io/pvduy23052005/nano-box-frontend:latest
    container_name: nano-box-frontend
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - ./frontend/.env
    depends_on:
      - api-gateway
    networks:
      - nano_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: nano-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - api-gateway
    networks:
      - nano_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mongodb_data:
    name: nano_mongodb_data
    driver: local
  notification_mongodb_data:
    name: nano_notification_mongodb_data
    driver: local
  redis_data:
    name: nano_redis_data
    driver: local
  rabbitmq_data:
    name: nano_rabbitmq_data
    driver: local



networks:
  nano_network:
    name: nano_network
    external: true
